name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'desktop_launcher.py'
      - 'BingoComunidade.spec'
      - 'requirements_desktop.txt'
      - 'requirements.txt'
      - 'app.py'
      - 'v114_patch.py'
      - 'pwa_patch.py'
      - 'templates/**'
      - 'static/**'
      - '.github/workflows/build-windows-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_desktop.txt

      - name: Syntax check
        run: |
          python -m py_compile app.py desktop_launcher.py cloud_entry.py v114_patch.py pwa_patch.py

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean BingoComunidade.spec

      - name: Prepare package
        shell: pwsh
        run: |
          @'
          BINGO COMUNIDADE - EXECUTAVEL WINDOWS

          IMPORTANTE:
          1. Este pacote NAO contem bingo.db.
          2. Coloque "Bingo Comunidade.exe" na mesma pasta do SEU bingo.db oficial.
          3. As 500 cartelas oficiais permanecem no bingo.db do seu computador.
          4. Faca uma copia de seguranca do bingo.db antes da primeira execucao.
          '@ | Set-Content -Encoding UTF8 "dist\LEIA_ANTES_DE_USAR.txt"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Bingo-Comunidade-Windows
          path: |
            dist/Bingo Comunidade.exe
            dist/LEIA_ANTES_DE_USAR.txt
          if-no-files-found: error
          retention-days: 30
